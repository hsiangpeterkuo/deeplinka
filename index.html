<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>富邦 AI PRO</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
  }
  #desktopMsg {
    display: none;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
  }
  #desktopMsg p {
    margin: 0;
  }
  #desktopMsg .main {
    font-size: 16px;
    color: #333;
  }
  #desktopMsg .sub {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
<div id="desktopMsg">
  <p class="main">您目前使用電腦裝置，請使用手機下載富邦AI PRO</p>
  <p class="sub">即將前往富邦AI PRO介紹頁面（<span id="countdown">3</span>）</p>
</div>
<script>
(function () {
  "use strict";

  // ---- 固定設定：下載連結與 App Scheme -------------------------------
  var APP_SCHEME_HOST = "fap-aipro://Launcher";
  var IOS_STORE_URL = "https://apps.apple.com/tw/app/id6751573234";
  var ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.fubon.securities.fubonaipro&hl=zh_TW";
  var ANDROID_PACKAGE = "com.fubon.securities.fubonaipro";
  var DESKTOP_URL = "https://www.fubon.com/securities/aipro/index.html";
  var FALLBACK_TIMEOUT_MS = 2000;

  var ua = navigator.userAgent || navigator.vendor || window.opera || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);

  if (!isIOS && !isAndroid) {
    var desktopMsgEl = document.getElementById("desktopMsg");
    var countdownEl = document.getElementById("countdown");
    desktopMsgEl.style.display = "flex";
    var remaining = 3;
    var countdownTimer = setInterval(function () {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownTimer);
        window.location.href = DESKTOP_URL;
        return;
      }
      countdownEl.textContent = remaining;
    }, 1000);
    return;
  }

  // ---- 解析網址參數 ------------------------------------------------
  function base64UrlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    var binary = atob(str);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  var searchParams = new URLSearchParams(window.location.search);
  var dParam = searchParams.get("d");
  var rawQuery = "";
  if (dParam) {
    try {
      rawQuery = base64UrlDecode(dParam);
    } catch (e) {
      rawQuery = "";
    }
  }
  var params = new URLSearchParams(rawQuery);

  var hasAction = false;
  params.forEach(function (value, key) {
    if (key.toLowerCase() === "action" && value) hasAction = true;
  });

  if (!hasAction) return;

  var deepLink = APP_SCHEME_HOST + (rawQuery ? "?" + rawQuery : "");

  function buildAndroidIntentUrl() {
    var intentPath = rawQuery ? "Launcher?" + rawQuery : "Launcher";
    return "intent://" + intentPath +
      "#Intent;scheme=fap-aipro;package=" + ANDROID_PACKAGE +
      ";S.browser_fallback_url=" + encodeURIComponent(ANDROID_STORE_URL) + ";end";
  }

  var storeUrl = isIOS ? IOS_STORE_URL : ANDROID_STORE_URL;
  var fallbackTimer = null;
  var redirected = false;

  function clearFallbackTimer() {
    if (fallbackTimer) {
      clearTimeout(fallbackTimer);
      fallbackTimer = null;
    }
  }

  function goToStore() {
    if (redirected || document.hidden) return;
    redirected = true;
    window.location.href = storeUrl;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) clearFallbackTimer();
  });
  window.addEventListener("pagehide", clearFallbackTimer);

  if (isAndroid) {
    // Chrome / 多數 Android 瀏覽器：intent:// 會自動處理未安裝時的商店導轉
    window.location.href = buildAndroidIntentUrl();
    fallbackTimer = setTimeout(goToStore, FALLBACK_TIMEOUT_MS);
  } else {
    window.location.href = deepLink;
    fallbackTimer = setTimeout(goToStore, FALLBACK_TIMEOUT_MS);
  }
})();
</script>
</body>
</html>
